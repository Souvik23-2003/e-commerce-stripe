<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <header class="bg-white shadow sticky top-0 z-50">
        <nav class="max-w-screen-xl mx-auto flex items-center 
        justify-between px-6 h-16">
            <h1 class="text-xl font-semibold">
               <a href="/" class="text-blue-600">MyStore</a>
            </h1>
            <ul class="list-none flex gap-6">
                <li>
                    <a href="/cart.html" class="text-gray-700
                    font-medium hover:text-gray-900">Cart</a>
                         <span id="cart-count" class="ml-1 inline-flex 
                         items-center justify-center bg-blue-600
                         text-white rounded-full px-1.5 min-w-[1.
                         25rem] h-5 align-top">
                            0

                         </span>
            
                    </a>
                </li>
                <li>
                    <a href="/admin.html"
                    class="text-gray-700 font-medium
                    hover:text-gray-900">Admin</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class ="max-w-screen-xl ml-auto py-6 px-6">
        <h2 class="text-2xl font-semibold mb-6">Your Cart</h2>
        <div class="space-y-4" id="cart-items-container">
            <p class="text-gray-600">Your cart is empty.</p>
        </div>
        <div class="text-right mt-8">
            <h3>
                Total: ₹<span id="cart-total">0.00</span>
            </h3>
            <button id="checkout-button" class="mt-4 inline-flex items-center justify-center 
    bg-blue-600 text-white px-4 py-2 rounded-md font-medium hover:bg-blue-700">
    Checkout with Stripe
</button>
        </div>
    </main>

    <script src="https://js.stripe.com/v3/"></script>
<script src="app.js"></script>
</body>
</html>
